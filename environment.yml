name: percusion_paper
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12

  # Core stack, pinned to the versions that work
  - numpy=2.4
  - pandas=3.0
  - xarray=2026.2
  - zarr=3.1
  - dask=2026.3
  - scipy=1.17
  - matplotlib=3.10
  - cartopy=0.25
  - metpy=1.7
  - seaborn

  # Data access and I/O (ipfs://, https zarr stores, netCDF, HDF5)
  - fsspec!=0.9.0
  - aiohttp
  - requests
  - netcdf4
  - h5netcdf
  - h5py

  # Satellite and HEALPix tools
  - goes2go
  - healpix

  # Other packages from the orcestra_book
  - cmocean
  - geopandas
  - geopy
  - hvplot
  - icalendar
  - intake>=0.7.0,<2.0.0
  - intake-xarray<=0.7.0
  - simplekml
  - statsmodels
  - topojson

  # Jupyter, VS Code interactive window, book building
  - ipykernel
  - ipywidgets
  - jupyterlab
  - jupytext
  - jupyter-book>=1,<2
  - jinja2
  - docutils

  - pip
  - pip:
      - orcestra==0.0.32
      - easygems==0.1.5
      - ipfsspec
      - pybtex-apa-style==1.3
      # Local packages: clone the repos on the server and install them
      # in editable mode after creating the environment:
      #   pip install -e <path>/PercusionGit
